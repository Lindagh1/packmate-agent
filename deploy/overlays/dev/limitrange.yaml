# Optional namespace defaults for dev — uncomment in overlays/dev/kustomization.yaml to enable.
apiVersion: v1
kind: LimitRange
metadata:
  name: packmate-defaults
  labels:
    app.kubernetes.io/part-of: packmate
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
