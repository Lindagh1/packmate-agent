apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: packmate-dev

resources:
  - ../../base

images:
  - name: quay.io/example/packmate-backend
    newName: quay.io/example/packmate-backend
    newTag: sha-dev
  - name: quay.io/example/packmate-frontend
    newName: quay.io/example/packmate-frontend
    newTag: sha-dev

patches:
  - path: configmap-patch.yaml

# Optional: enable OpenShift OAuth proxy in front of the app.
# components:
#   - ../../components/oauth-proxy
