apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: packmate-frontend
  labels:
    app.kubernetes.io/name: packmate-frontend
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: packmate-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OpenShift ingress controller pods (Route traffic).
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Proxy /api to the backend Service (packmate-backend:8080).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: packmate-backend
      ports:
        - protocol: TCP
          port: 8080
