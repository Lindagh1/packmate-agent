apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: packmate-frontend
  labels:
    app.kubernetes.io/name: packmate-frontend
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: packmate-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OpenShift ingress controller (label used by some installs).
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
    # OpenShift router namespace (common on 4.x).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Frontend needs reliable DNS to the cluster DNS Service IP (172.30.0.10).
    # NamespaceSelector-only rules were insufficient under OVN on this cluster;
    # keep ingress locked while allowing egress (backend + DNS).
    - {}
