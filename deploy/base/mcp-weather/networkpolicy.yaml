apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weather-mcp
  labels:
    app.kubernetes.io/name: weather-mcp
    app.kubernetes.io/component: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: weather-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: packmate-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Weather MCP must resolve and call the public Open-Meteo API.
    # OpenShift OVN DNAT to the cluster DNS Service IP (172.30.0.10) did not
    # match namespaceSelector-only rules reliably; allow all egress while
    # keeping ingress locked to backend + router.
    - {}
