apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: packmate-backend
  labels:
    app.kubernetes.io/name: packmate-backend
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: packmate-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the frontend may call the API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: packmate-frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Backend must reach cluster DNS, in-namespace MCP Services, and the model
    # Service in my-first-model. Strict DNS Service-CIDR rules were unreliable
    # under OVN on this cluster (same issue as weather-mcp). Keep ingress locked.
    - {}
