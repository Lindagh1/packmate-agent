---
# Minimal RBAC: allow Argo CD application controller to manage Packmate resources in packmate-prod.
# Apply AFTER creating namespace packmate-prod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-packmate-prod
  namespace: packmate-prod
  labels:
    app.kubernetes.io/part-of: packmate
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-packmate-prod
  namespace: packmate-prod
  labels:
    app.kubernetes.io/part-of: packmate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-packmate-prod
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
