# Argo CD AppProject for Packmate PRODUCTION only.
# Placeholders replaced by bootstrap: __GIT_REPO_URL__
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: packmate
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: packmate
spec:
  description: Packmate production GitOps — destination packmate-prod only (no wildcards)
  sourceRepos:
    - __GIT_REPO_URL__
  destinations:
    - namespace: packmate-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: route.openshift.io
      kind: Route
    # Secret kind is whitelisted so Sync does not fail if a future Git-managed
    # Secret appears; instructor-created packmate-prod-llm is NOT in Git and
    # must not be pruned (prune disabled on Application).
    - group: ""
      kind: Secret
  orphanedResources:
    warn: true
  roles:
    # Participant role — Sync only on Application packmate-prod.
    - name: promoter
      description: Packmate lab participants may view and Sync packmate-prod only
      groups:
        - __PACKMATE_ARGO_GROUP__
      policies:
        - p, proj:packmate:promoter, applications, get, packmate/packmate-prod, allow
        - p, proj:packmate:promoter, applications, sync, packmate/packmate-prod, allow
