# Argo CD Application packmate-lab (DEV) — AppProject packmate.
# Automated reconciliation allowed; prune=false; selfHeal=false.
# Does NOT manage Workbenches, Notebooks, Pipelines, AI endpoint Secrets, or models.
# Placeholders: __GIT_REPO_URL__ __GIT_REVISION__
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: packmate-lab
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: packmate
    app.kubernetes.io/component: lab
    packmate.io/environment: lab
spec:
  project: packmate
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_REVISION__
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: packmate-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  # Explicitly omit automated.prune=true / selfHeal=true for workshop safety.
  revisionHistoryLimit: 5
