---
# Packmate v2 — main-branch push pipeline.
# Runs PR checks, builds/pushes images, updates GitOps manifests by digest, and commits.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: packmate-push
  labels:
    app.kubernetes.io/part-of: packmate
    app.kubernetes.io/component: ci
spec:
  params:
    - name: git-url
      type: string
      description: Application repository clone URL
    - name: git-revision
      type: string
      description: Git revision that triggered the build (commit SHA)
    - name: output-image-backend
      type: string
      description: Fully qualified backend image (registry/repo/name:tag)
    - name: output-image-frontend
      type: string
      description: Fully qualified frontend image (registry/repo/name:tag)
    - name: gitops-branch
      type: string
      description: Branch to update in the GitOps repository
      default: main
    - name: gitops-overlay
      type: string
      description: Kustomize overlay to patch (dev or prod)
      default: dev
    - name: evaluation-threshold
      type: string
      description: Minimum deterministic evaluation score (0.0–1.0)
      default: "0.90"
  workspaces:
    - name: source
      description: Cloned application source
    - name: shared-data
      description: Image digests and intermediate artifacts
    - name: dockerconfig
      description: Registry push credentials (registry-auth secret)
    - name: git-auth
      description: Git push credentials (gitops-repo-auth secret)
  tasks:
    - name: clone
      taskSpec:
        params:
          - name: url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: output
        steps:
          - name: clone
            image: registry.redhat.io/ubi9/git:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              git clone "$(params.url)" /workspace/output/source
              cd /workspace/output/source
              git checkout "$(params.revision)"
              echo "Checked out $(git rev-parse --short HEAD)"
        workspaces:
          - name: output
            workspace: source
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: backend-tests
      runAfter:
        - clone
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: pytest
            image: registry.redhat.io/ubi9/python-312:latest
            workingDir: $(workspaces.source.path)/source/backend
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              python3 -m venv /tmp/venv
              source /tmp/venv/bin/activate
              pip install --quiet -r requirements-dev.txt
              pytest -v
        workspaces:
          - name: source
            workspace: source

    - name: quality-gate
      runAfter:
        - backend-tests
      taskSpec:
        params:
          - name: threshold
            type: string
        workspaces:
          - name: source
        steps:
          - name: deterministic-evals
            image: registry.redhat.io/ubi9/python-312:latest
            workingDir: $(workspaces.source.path)/source/backend
            env:
              - name: THRESHOLD
                value: $(params.threshold)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              python3 -m venv /tmp/venv
              source /tmp/venv/bin/activate
              pip install --quiet -r requirements-dev.txt
              python -m evals.runner --mode deterministic --threshold "${THRESHOLD}"
        workspaces:
          - name: source
            workspace: source
      params:
        - name: threshold
          value: $(params.evaluation-threshold)

    - name: frontend-ci
      runAfter:
        - clone
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: lint-test-build
            image: registry.redhat.io/ubi9/nodejs-22:latest
            workingDir: $(workspaces.source.path)/source/frontend
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              npm ci
              npm run lint
              npm run test
              npm run build
        workspaces:
          - name: source
            workspace: source

    - name: validate-containerfiles
      runAfter:
        - clone
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: buildah-validate
            image: quay.io/buildah/stable:latest
            workingDir: $(workspaces.source.path)/source
            securityContext:
              privileged: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              export STORAGE_DRIVER=vfs
              export BUILDAH_ISOLATION=chroot
              buildah bud --layers -f backend/Containerfile -t localhost/packmate-backend:ci-validate backend/
              buildah bud --layers -f frontend/Containerfile -t localhost/packmate-frontend:ci-validate frontend/
        workspaces:
          - name: source
            workspace: source

    - name: validate-manifests
      runAfter:
        - clone
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: render-and-validate
            image: registry.redhat.io/ubi9/python-312:latest
            workingDir: $(workspaces.source.path)/source
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              pip install --quiet pyyaml
              ./scripts/render-manifests.sh
              ./scripts/validate-manifests.sh
        workspaces:
          - name: source
            workspace: source

    - name: security-check
      runAfter:
        - clone
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: policy-check
            image: registry.redhat.io/ubi9/python-312:latest
            workingDir: $(workspaces.source.path)/source
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ./scripts/security-check.sh
        workspaces:
          - name: source
            workspace: source

    - name: build-push-backend
      runAfter:
        - quality-gate
        - frontend-ci
        - validate-containerfiles
        - validate-manifests
        - security-check
      taskSpec:
        params:
          - name: image
            type: string
        workspaces:
          - name: source
          - name: shared-data
          - name: dockerconfig
        steps:
          - name: build-and-push
            image: quay.io/buildah/stable:latest
            workingDir: $(workspaces.source.path)/source
            securityContext:
              privileged: true
            env:
              - name: IMAGE
                value: $(params.image)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              export STORAGE_DRIVER=vfs
              export BUILDAH_ISOLATION=chroot
              if [[ -f "$(workspaces.dockerconfig.path)/.dockerconfigjson" ]]; then
                mkdir -p "${HOME}/.docker"
                cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" "${HOME}/.docker/config.json"
              fi
              buildah bud --layers -f backend/Containerfile -t "${IMAGE}" backend/
              buildah push --format docker --digestfile "$(workspaces.shared-data.path)/backend.digest" "${IMAGE}"
              echo "Backend digest: $(cat "$(workspaces.shared-data.path)/backend.digest")"
        workspaces:
          - name: source
            workspace: source
          - name: shared-data
            workspace: shared-data
          - name: dockerconfig
            workspace: dockerconfig
      params:
        - name: image
          value: $(params.output-image-backend)

    - name: build-push-frontend
      runAfter:
        - quality-gate
        - frontend-ci
        - validate-containerfiles
        - validate-manifests
        - security-check
      taskSpec:
        params:
          - name: image
            type: string
        workspaces:
          - name: source
          - name: shared-data
          - name: dockerconfig
        steps:
          - name: build-and-push
            image: quay.io/buildah/stable:latest
            workingDir: $(workspaces.source.path)/source
            securityContext:
              privileged: true
            env:
              - name: IMAGE
                value: $(params.image)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              export STORAGE_DRIVER=vfs
              export BUILDAH_ISOLATION=chroot
              if [[ -f "$(workspaces.dockerconfig.path)/.dockerconfigjson" ]]; then
                mkdir -p "${HOME}/.docker"
                cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" "${HOME}/.docker/config.json"
              fi
              buildah bud --layers -f frontend/Containerfile -t "${IMAGE}" frontend/
              buildah push --format docker --digestfile "$(workspaces.shared-data.path)/frontend.digest" "${IMAGE}"
              echo "Frontend digest: $(cat "$(workspaces.shared-data.path)/frontend.digest")"
        workspaces:
          - name: source
            workspace: source
          - name: shared-data
            workspace: shared-data
          - name: dockerconfig
            workspace: dockerconfig
      params:
        - name: image
          value: $(params.output-image-frontend)

    - name: update-gitops
      runAfter:
        - build-push-backend
        - build-push-frontend
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
          - name: gitops-branch
            type: string
          - name: gitops-overlay
            type: string
          - name: output-image-backend
            type: string
          - name: output-image-frontend
            type: string
        workspaces:
          - name: shared-data
          - name: git-auth
        steps:
          - name: patch-and-push
            image: registry.redhat.io/ubi9/git:latest
            env:
              - name: GIT_URL
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.git-revision)
              - name: GITOPS_BRANCH
                value: $(params.gitops-branch)
              - name: GITOPS_OVERLAY
                value: $(params.gitops-overlay)
              - name: BACKEND_IMAGE
                value: $(params.output-image-backend)
              - name: FRONTEND_IMAGE
                value: $(params.output-image-frontend)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              BACKEND_DIGEST="$(cat "$(workspaces.shared-data.path)/backend.digest")"
              FRONTEND_DIGEST="$(cat "$(workspaces.shared-data.path)/frontend.digest")"
              BACKEND_REPO="${BACKEND_IMAGE%%:*}"
              FRONTEND_REPO="${FRONTEND_IMAGE%%:*}"

              if [[ "${BACKEND_DIGEST}" == *":latest"* || "${FRONTEND_DIGEST}" == *":latest"* ]]; then
                echo "ERROR: refusing to pin :latest digest in GitOps manifests" >&2
                exit 1
              fi

              if [[ -d "$(workspaces.git-auth.path)" ]]; then
                if [[ -f "$(workspaces.git-auth.path)/.git-credentials" ]]; then
                  git config --global credential.helper store
                  cp "$(workspaces.git-auth.path)/.git-credentials" "${HOME}/.git-credentials"
                  chmod 600 "${HOME}/.git-credentials"
                fi
                if [[ -f "$(workspaces.git-auth.path)/username" && -f "$(workspaces.git-auth.path)/password" ]]; then
                  GIT_USER="$(cat "$(workspaces.git-auth.path)/username")"
                  GIT_PASS="$(cat "$(workspaces.git-auth.path)/password")"
                  git config --global credential.helper store
                  printf 'https://%s:%s@%s\n' "${GIT_USER}" "${GIT_PASS}" "$(echo "${GIT_URL}" | sed -E 's#https?://##; s#/.*##')" \
                    > "${HOME}/.git-credentials"
                fi
              fi

              git config --global user.email "packmate-ci@redhat.demo"
              git config --global user.name "Packmate CI"

              workdir="$(mktemp -d)"
              git clone --branch "${GITOPS_BRANCH}" "${GIT_URL}" "${workdir}/repo"
              cd "${workdir}/repo"
              git checkout "${GITOPS_BRANCH}"

              kustom="${workdir}/repo/deploy/overlays/${GITOPS_OVERLAY}/kustomization.yaml"
              if [[ ! -f "${kustom}" ]]; then
                echo "ERROR: missing ${kustom}" >&2
                exit 1
              fi

              python3 - "${kustom}" "${BACKEND_REPO}" "${BACKEND_DIGEST}" "${FRONTEND_REPO}" "${FRONTEND_DIGEST}" <<'PY'
              import sys
              from pathlib import Path

              try:
                  import yaml
              except ImportError:
                  import subprocess
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"])
                  import yaml

              path, backend_repo, backend_digest, frontend_repo, frontend_digest = sys.argv[1:6]
              data = yaml.safe_load(Path(path).read_text())
              images = data.setdefault("images", [])
              wanted = {
                  backend_repo: {"newName": backend_repo, "digest": backend_digest},
                  frontend_repo: {"newName": frontend_repo, "digest": frontend_digest},
              }
              out = []
              seen = set()
              for entry in images:
                  name = entry.get("name", "")
                  if name in wanted:
                      merged = {"name": name, **wanted[name]}
                      out.append(merged)
                      seen.add(name)
                  else:
                      out.append(entry)
              for name, spec in wanted.items():
                  if name not in seen:
                      out.append({"name": name, **spec})
              data["images"] = out
              Path(path).write_text(yaml.safe_dump(data, sort_keys=False))
              PY

              git add "deploy/overlays/${GITOPS_OVERLAY}/kustomization.yaml"
              if git diff --cached --quiet; then
                echo "GitOps manifests already up to date."
                exit 0
              fi
              git commit -m "ci(${GITOPS_OVERLAY}): pin images to ${GIT_REVISION}

              backend: ${BACKEND_REPO}@${BACKEND_DIGEST}
              frontend: ${FRONTEND_REPO}@${FRONTEND_DIGEST}"
              git push origin "${GITOPS_BRANCH}"
              echo "GitOps overlay ${GITOPS_OVERLAY} updated on ${GITOPS_BRANCH}."
        workspaces:
          - name: shared-data
            workspace: shared-data
          - name: git-auth
            workspace: git-auth
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
        - name: gitops-branch
          value: $(params.gitops-branch)
        - name: gitops-overlay
          value: $(params.gitops-overlay)
        - name: output-image-backend
          value: $(params.output-image-backend)
        - name: output-image-frontend
          value: $(params.output-image-frontend)

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: packmate-push-
  labels:
    app.kubernetes.io/part-of: packmate
    app.kubernetes.io/component: ci
    tekton.dev/pipeline: packmate-push
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  pipelineRef:
    name: packmate-push
  params:
    - name: git-url
      value: https://github.com/example/packmate-agent.git
    - name: git-revision
      value: "{{ revision }}"
    - name: output-image-backend
      value: quay.io/example/packmate-backend:sha-{{ revision_short }}
    - name: output-image-frontend
      value: quay.io/example/packmate-frontend:sha-{{ revision_short }}
    - name: gitops-branch
      value: main
    - name: gitops-overlay
      value: dev
    - name: evaluation-threshold
      value: "0.90"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    - name: shared-data
      emptyDir: {}
    - name: dockerconfig
      secret:
        secretName: registry-auth
    - name: git-auth
      secret:
        secretName: gitops-repo-auth
