# Example Packmate CI PipelineRun — shared PVC workspace (required).
# Prefer this over Empty Directory: each Task must see the clone output.
#
# Console: Pipelines → packmate-ci → Start → Workspace source →
#          VolumeClaimTemplate → 2 GiB → Start
#
# CLI:
#   oc create -n packmate-lab -f .tekton/lab/packmate-ci-pipelinerun.example.yaml
#
# After it Succeeds, promote the validated backend digest to production:
#   scripts/promote-backend-image.sh --pipelinerun <pipelinerun-name> --namespace packmate-lab --create-pr
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: packmate-ci-
  labels:
    app.kubernetes.io/part-of: packmate
    app.kubernetes.io/component: lab-pipeline
spec:
  pipelineRef:
    name: packmate-ci
  taskRunTemplate:
    serviceAccountName: packmate-pipeline
  params:
    - name: git-url
      value: https://github.com/YOUR_GITHUB_USERNAME/packmate-agent.git
    - name: git-revision
      value: packmate-v2
    - name: quality-threshold
      value: "0.90"
  workspaces:
    - name: source
      volumeClaimTemplate:
        metadata:
          labels:
            app.kubernetes.io/part-of: packmate
        spec:
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          resources:
            requests:
              storage: 2Gi
