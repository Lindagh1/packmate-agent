services:
  packmate-backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: packmate-backend:dev
    ports:
      - "8000:8080"
    environment:
      BASE_URL: ${BASE_URL:-}
      MODEL: ${MODEL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - packmate-network

  packmate-frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: packmate-frontend:dev
    ports:
      - "8080:8080"
    depends_on:
      packmate-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - packmate-network

networks:
  packmate-network:
    name: packmate-network
    driver: bridge
